# =============================================================
# URS-DMS — Docker Compose
# Sprint 1: postgres + minio + pgadmin + server (foundation only)
# =============================================================
# Usage:
#   docker compose up -d        # start everything in the background
#   docker compose down         # stop everything (keeps volumes)
#   docker compose down -v      # stop + delete volumes (RESET)
#   docker compose logs -f server
# =============================================================

name: urs-dms

services:
  # ────────────────────────────────────────────────────────
  # PostgreSQL 16 — primary database
  # ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: urs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urs_password}
      POSTGRES_DB: ${POSTGRES_DB:-urs_dms}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - urs-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urs_user} -d ${POSTGRES_DB:-urs_dms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage
  # ────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: urs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urs_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-urs_minio_secret}
    volumes:
      - urs-minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # pgAdmin 4 — Web UI for postgres (optional but useful)
  # ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: urs-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@urs.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    volumes:
      - urs-pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urs-net

  # ────────────────────────────────────────────────────────
  # URS-DMS server — Node.js + Express + Prisma
  # ────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: urs-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override docker-internal hostnames
      DATABASE_URL: postgresql://${POSTGRES_USER:-urs_user}:${POSTGRES_PASSWORD:-urs_password}@urs-postgres:5432/${POSTGRES_DB:-urs_dms}?schema=public
      MINIO_ENDPOINT: urs-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      NODE_ENV: production
      PORT: 4000
    volumes:
      - urs-server-logs:/app/logs
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - urs-net

# ────────────────────────────────────────────────────────────
# Named volumes (persist data across `docker compose down`)
# ────────────────────────────────────────────────────────────
volumes:
  urs-postgres-data:
    driver: local
  urs-minio-data:
    driver: local
  urs-pgadmin-data:
    driver: local
  urs-server-logs:
    driver: local

# ────────────────────────────────────────────────────────────
# Custom network (DNS by service name, isolation)
# ────────────────────────────────────────────────────────────
networks:
  urs-net:
    driver: bridge
