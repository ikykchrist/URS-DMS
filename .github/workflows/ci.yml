# =============================================================
# URS-DMS CI Pipeline
# Runs on every push and pull request.
# Steps: install → typecheck → lint → format → audit → docker build
# =============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────
  # Server checks
  # ────────────────────────────────────────────────────────
  server-checks:
    name: Server checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urs_user
          POSTGRES_PASSWORD: urs_password
          POSTGRES_DB: urs_dms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urs_user -d urs_dms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Generate deterministic test secrets so CI never uses real ones
      JWT_ACCESS_SECRET: ci_test_access_secret_at_least_32_characters_long_xxx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_characters_long_xxx
      DATABASE_URL: postgresql://urs_user:urs_password@localhost:5432/urs_dms_test?schema=public
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm --workspace server run prisma:generate

      - name: TypeScript typecheck
        run: npm --workspace server run typecheck

      - name: ESLint
        run: npm --workspace server run lint

      - name: Prettier check
        run: npm --workspace server run format:check

      - name: npm audit (high+critical)
        run: npm --workspace server audit --audit-level=high

  # ────────────────────────────────────────────────────────
  # Client checks
  # ────────────────────────────────────────────────────────
  client-checks:
    name: Client checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck:client || echo "Client typecheck not configured"

      - name: ESLint
        run: npm run lint:client || echo "Client lint not configured"

  # ────────────────────────────────────────────────────────
  # Docker build (server image)
  # ────────────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [server-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: urs-dms/server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────
  # Docker Compose smoke test
  # ────────────────────────────────────────────────────────
  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build all images
        run: docker compose build

      - name: Start stack
        run: |
          docker compose up -d postgres minio
          # Wait for postgres to be healthy
          for i in {1..30}; do
            if docker compose ps postgres | grep -q "(healthy)"; then break; fi
            sleep 2
          done
          # Wait for minio to be healthy
          for i in {1..30}; do
            if docker compose ps minio | grep -q "(healthy)"; then break; fi
            sleep 2
          done
          # Start server
          docker compose up -d server
          # Wait for server health
          for i in {1..30}; do
            if curl -sf http://localhost:4000/api/v1/health > /dev/null; then
              echo "✅ Server is healthy"
              break
            fi
            sleep 2
          done

      - name: Probe /health
        run: |
          RESPONSE=$(curl -sf http://localhost:4000/api/v1/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' && echo "✅ health ok" || (echo "❌ health failed"; exit 1)
          echo "$RESPONSE" | grep -q '"database"' && echo "✅ database reachable" || (echo "❌ database unreachable"; exit 1)
          echo "$RESPONSE" | grep -q '"minio"' && echo "✅ minio reachable" || (echo "❌ minio unreachable"; exit 1)

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
